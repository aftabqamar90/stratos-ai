services:
  backend:
    build:
      context: ./backend
    ports:
      - "501:501"
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-501}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:500}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./stratos.db}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}

  frontend:
    build:
      context: ./frontend
    ports:
      - "500:500"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:501}
    depends_on:
      - backend
